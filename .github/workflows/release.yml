name: Promote Verified Native Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing quarantined draft tag'
        required: true
        type: string
      candidate_sha:
        description: 'Full 40-character tested candidate SHA'
        required: true
        type: string
      expected_dmg_sha256:
        description: 'SHA-256 approved from quarantined exact-byte verification'
        required: true
        type: string
      release_notes_path:
        description: 'Tracked finalized release notes path'
        required: true
        default: 'docs/releases/1.0.6.md'
        type: string
      go_live_decision:
        description: 'Exact release authorization literal; must be GO-LIVE'
        required: true
        type: string

permissions:
  contents: read

# This lock serializes participating Actions runs only. Repository administrators,
# Contents/Workflows writers, environment administrators/reviewers, and release-App
# private-key holders are the trusted computing base. GitHub Update Release has no
# documented compare-and-swap precondition. A malicious privileged actor is outside
# this design; use a transactional/CAS publication store if that threat must be resisted.
concurrency:
  group: roachnet-public-release
  cancel-in-progress: false

jobs:
  verify-staged-candidate:
    name: Read-only verification of exact staged candidate
    runs-on: blacksmith-6vcpu-macos-15
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
      RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
    steps:
      - name: Fail closed on read-only verification inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in RELEASE_TAG CANDIDATE_SHA EXPECTED_DMG_SHA256 RELEASE_NOTES_PATH; do
            [[ -n "${!name:-}" ]] || { echo "Missing required verification input: $name" >&2; exit 1; }
          done
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DMG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SHA" == "$CANDIDATE_SHA" ]] || { echo 'Dispatch promotion from the exact candidate SHA/tag.' >&2; exit 1; }
      - name: Checkout exact tested candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 26
        # No dependency cache: this privileged job runs the candidate's npm ci, and a
        # cache it saved could be restored by later default-branch runs.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          package-manager-cache: false
      - name: Prove tag, draft release, release copy, and candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$CANDIDATE_SHA" ]]
          VERSION="$(node -p 'require("./package.json").version')"
          [[ "$RELEASE_TAG" == "v$VERSION" && "$VERSION" != '1.0.5' ]]
          git ls-files --error-unmatch -- "$RELEASE_NOTES_PATH"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft and .prerelease')" == true ]]
          EXPECTED_ASSETS=$'RoachNet-Setup-macOS.dmg\nRoachNet-Setup-macOS.dmg.sha256\nbinary-license-inventory.json\nrelease-provenance.json\nsbom.spdx.json\nvulnerability-scan.json'
          ACTUAL_ASSETS="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name' | sort)"
          [[ "$ACTUAL_ASSETS" == "$EXPECTED_ASSETS" ]] || { printf 'Unexpected staged assets:\n%s\n' "$ACTUAL_ASSETS" >&2; exit 1; }
      - name: Download exact quarantined assets and immutable stage-run records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PACKET="$RUNNER_TEMP/verification-packet"
          Q="$PACKET/quarantine"
          mkdir -p "$Q" "$PACKET/provenance" "$PACKET/snapshot" "$PACKET/gate-materials"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$Q"
          (cd "$Q" && shasum -a 256 -c RoachNet-Setup-macOS.dmg.sha256)
          ACTUAL_DMG_SHA256="$(shasum -a 256 "$Q/RoachNet-Setup-macOS.dmg" | awk '{print $1}')"
          [[ "$ACTUAL_DMG_SHA256" == "$EXPECTED_DMG_SHA256" ]]
          NOTES_SHA256="$(shasum -a 256 "$RELEASE_NOTES_PATH" | awk '{print $1}')"
          node -e 'const fs=require("fs"),path=require("path"),crypto=require("crypto"); const [file,root,sha,tag,dmg,notes]=process.argv.slice(1),p=JSON.parse(fs.readFileSync(file)); const expected=["RoachNet-Setup-macOS.dmg","RoachNet-Setup-macOS.dmg.sha256","sbom.spdx.json","binary-license-inventory.json","vulnerability-scan.json"].sort(); if(p.schema!=="org.roachnet.release-provenance.v2"||p.candidateSha!==sha||p.tag!==tag||p.artifact?.sha256!==dmg||p.releaseNotes?.sha256!==notes||p.workflow?.path!==".github/workflows/native-packages.yml"||!Number.isSafeInteger(p.workflow?.runId)||!Number.isSafeInteger(p.workflow?.runAttempt)||!p.renderedReleaseBody?.sha256||p.signing?.verified!==true||p.signing?.hardenedRuntime!==true||p.signing?.timestamped!==true||p.notarization?.status!=="Accepted"||p.notarization?.stapled!==true||p.notarization?.gatekeeper!=="verified"||JSON.stringify(Object.keys(p.assets||{}).sort())!==JSON.stringify(expected)) process.exit(1); for(const name of expected){const target=path.join(root,name),bytes=fs.statSync(target).size,digest=crypto.createHash("sha256").update(fs.readFileSync(target)).digest("hex"); if(p.assets[name]?.bytes!==bytes||p.assets[name]?.sha256!==digest) process.exit(1)}' \
            "$Q/release-provenance.json" "$Q" "$CANDIDATE_SHA" "$RELEASE_TAG" "$ACTUAL_DMG_SHA256" "$NOTES_SHA256"
          STAGE_RUN_ID="$(node -p 'require(process.argv[1]).workflow.runId' "$Q/release-provenance.json")"
          STAGE_RUN_ATTEMPT="$(node -p 'require(process.argv[1]).workflow.runAttempt' "$Q/release-provenance.json")"
          RUN_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" --jq '[.conclusion,.event,.head_sha,.path,(.run_attempt|tostring)] | @tsv')"
          [[ "$RUN_STATE" == $'success\tworkflow_dispatch\t'"$CANDIDATE_SHA"$'\t.github/workflows/native-packages.yml\t'"$STAGE_RUN_ATTEMPT" ]]
          JOB_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID/jobs" --paginate --jq '[.jobs[] | select(.name == "Build, verify, and quarantine signed RC" and .conclusion == "success")] | length')"
          [[ "$JOB_COUNT" -eq 1 ]] || { echo 'Provenance does not resolve to one successful protected stage-release job.' >&2; exit 1; }
          gh run download "$STAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "roachnet-release-provenance-$CANDIDATE_SHA-$STAGE_RUN_ATTEMPT" --dir "$PACKET/provenance"
          gh run download "$STAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "roachnet-staged-release-snapshot-$CANDIDATE_SHA-$STAGE_RUN_ATTEMPT" --dir "$PACKET/snapshot"
          gh run download "$STAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "roachnet-release-gate-materials-$CANDIDATE_SHA-$STAGE_RUN_ATTEMPT" --dir "$PACKET/gate-materials"
          cmp "$Q/release-provenance.json" "$PACKET/provenance/release-provenance.json"
          node scripts/verify-release-body.mjs \
            --notes "$RELEASE_NOTES_PATH" \
            --provenance "$Q/release-provenance.json" \
            --body "$PACKET/provenance/stable-release-body.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$PACKET/staged-release.json"
          node scripts/staged-release-snapshot.mjs \
            --mode verify \
            --release-json "$PACKET/staged-release.json" \
            --provenance "$Q/release-provenance.json" \
            --notes "$RELEASE_NOTES_PATH" \
            --snapshot "$PACKET/snapshot/staged-release-snapshot.json"
          node scripts/verify-release-gate-evidence.mjs \
            --evidence "$PACKET/snapshot/release-gate-evidence.json" \
            --provenance "$Q/release-provenance.json" \
            --snapshot "$PACKET/snapshot/staged-release-snapshot.json"
          node scripts/verify-release-gate-materials.mjs \
            --results "$PACKET/gate-materials/release-gate-results.json" \
            --evidence-root "$PACKET/gate-materials/gate-evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-sha "$CANDIDATE_SHA" \
            --artifact-sha256 "$ACTUAL_DMG_SHA256"
          while IFS=$'\t' read -r gate_id gate_run_id gate_run_attempt check_name; do
            GATE_RUN_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$gate_run_id" --jq '[.conclusion,.head_sha,(.run_attempt|tostring)] | @tsv')"
            [[ "$GATE_RUN_STATE" == $'success\t'"$CANDIDATE_SHA"$'\t'"$gate_run_attempt" ]] || { echo "Gate $gate_id does not resolve to its exact successful candidate run." >&2; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$gate_run_id/jobs?per_page=100" > "$RUNNER_TEMP/gate-jobs.json"
            CHECK_NAME="$check_name" node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync(process.argv[1])),matches=(p.jobs||[]).filter(j=>j.name===process.env.CHECK_NAME&&j.conclusion==="success"); if(matches.length!==1) process.exit(1)' "$RUNNER_TEMP/gate-jobs.json" || { echo "Gate $gate_id check does not resolve to exactly one successful job." >&2; exit 1; }
          done < <(node -e 'const p=require(process.argv[1]); for(const g of p.gates) console.log([g.gateId,g.runId,g.runAttempt,g.checkName].join("\t"))' "$PACKET/snapshot/release-gate-evidence.json")
      - name: Verify exact staged signatures, stapling, Gatekeeper, and supply-chain evidence
        shell: bash
        run: |
          set -euo pipefail
          PACKET="$RUNNER_TEMP/verification-packet"
          Q="$PACKET/quarantine"
          MOUNT="$RUNNER_TEMP/roachnet-verification-mount"
          EXTRACTED="$RUNNER_TEMP/roachnet-verification-extracted"
          mkdir -p "$MOUNT" "$EXTRACTED"
          hdiutil attach "$Q/RoachNet-Setup-macOS.dmg" -readonly -nobrowse -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          SETUP_APP="$MOUNT/RoachNet Setup/RoachNet Setup.app"
          codesign --verify --deep --strict --verbose=2 "$SETUP_APP"
          APP_ZIP="$(find "$SETUP_APP/Contents/Resources/InstallerAssets" -maxdepth 1 -name 'RoachNet-*-mac-arm64.zip' -print -quit)"
          [[ -n "$APP_ZIP" ]]
          ditto -x -k "$APP_ZIP" "$EXTRACTED"
          DESKTOP_APP="$EXTRACTED/RoachNet.app"
          codesign --verify --deep --strict --verbose=2 "$DESKTOP_APP"
          for app in "$SETUP_APP" "$DESKTOP_APP"; do
            DETAILS="$(codesign -dv --verbose=4 "$app" 2>&1)"
            grep -Fq 'Authority=Developer ID Application:' <<<"$DETAILS"
            grep -Eq 'flags=.*runtime' <<<"$DETAILS"
            grep -Eq '^Timestamp=' <<<"$DETAILS"
          done
          xcrun stapler validate "$SETUP_APP"
          xcrun stapler validate "$Q/RoachNet-Setup-macOS.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$Q/RoachNet-Setup-macOS.dmg"
          hdiutil detach "$MOUNT"
          trap - EXIT
          npm ci
          npm audit --audit-level=high
          npm run audit:release
          node scripts/audit-release-supply-chain.mjs \
            --inventory "$Q/binary-license-inventory.json" \
            --sbom "$Q/sbom.spdx.json" \
            --candidate-sha "$CANDIDATE_SHA" \
            --tag "$RELEASE_TAG" \
            --dmg-sha256 "$EXPECTED_DMG_SHA256" \
            --online verify
      - name: Upload immutable read-only verification packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roachnet-promotion-verification-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-packet
          if-no-files-found: error
          retention-days: 30

  authorize-and-promote:
    name: Protected GO-LIVE authorization and exact-byte promotion
    needs: verify-staged-candidate
    runs-on: blacksmith-6vcpu-macos-15
    environment: roachnet-release-production
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      DEPLOYMENT_AUTHORIZED_USERS: ${{ secrets.DEPLOYMENT_AUTHORIZED_USERS }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
      ROACHNET_RELEASE_APP_CLIENT_ID: ${{ vars.ROACHNET_RELEASE_APP_CLIENT_ID }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
      RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
      GO_LIVE_DECISION: ${{ inputs.go_live_decision }}
      GO_LIVE_PREDICATE_TYPE: https://github.com/RoachWares/RoachNet/attestations/go-live/v1
    steps:
      - name: Fail closed after protected approval on actor, literal decision, and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GO_LIVE_DECISION" == 'GO-LIVE' ]] || { echo 'go_live_decision must be the exact literal GO-LIVE.' >&2; exit 1; }
          authorized=false
          while IFS= read -r allowed_actor; do
            if [[ -n "$allowed_actor" && "$allowed_actor" == "$GITHUB_TRIGGERING_ACTOR" ]]; then authorized=true; fi
          done < <(printf '%s' "$DEPLOYMENT_AUTHORIZED_USERS" | tr ',[:space:]' '\n' | sed '/^$/d')
          [[ "$authorized" == true ]] || { echo 'Triggering actor is not an exact release allowlist member.' >&2; exit 1; }
          for name in APPLE_NOTARY_TEAM_ID APPLE_NOTARY_APPLE_ID APPLE_NOTARY_APP_PASSWORD ROACHNET_RELEASE_APP_CLIENT_ID RELEASE_TAG CANDIDATE_SHA EXPECTED_DMG_SHA256 RELEASE_NOTES_PATH; do
            [[ -n "${!name:-}" ]] || { echo "Missing required promotion prerequisite: $name" >&2; exit 1; }
          done
      - name: Prove production environment reviewer policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/environments/roachnet-release-production")"
          REVIEWER_COUNT="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String((p.protection_rules||[]).filter(r=>r.type==="required_reviewers").flatMap(r=>r.reviewers||[]).length))' "$ENVIRONMENT_JSON")"
          PREVENT_SELF_REVIEW="$(node -e 'const p=JSON.parse(process.argv[1]),r=(p.protection_rules||[]).find(r=>r.type==="required_reviewers"); process.stdout.write(String(r?.prevent_self_review===true))' "$ENVIRONMENT_JSON")"
          [[ "$REVIEWER_COUNT" -ge 1 && "$PREVENT_SELF_REVIEW" == true ]] || { echo 'Production requires reviewers with prevent-self-review enabled.' >&2; exit 1; }
      - name: Checkout exact tested candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 26
        # No dependency cache: this privileged job runs the candidate's npm ci, and a
        # cache it saved could be restored by later default-branch runs.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          package-manager-cache: false
      - name: Download successful read-only verification packet
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: roachnet-promotion-verification-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-packet
      - name: Fresh exact-snapshot, quarantine, notary, and tag recheck after approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PACKET="$RUNNER_TEMP/verification-packet"
          Q="$RUNNER_TEMP/fresh-quarantine"
          PROVENANCE="$PACKET/quarantine/release-provenance.json"
          SNAPSHOT="$PACKET/snapshot/staged-release-snapshot.json"
          GATES="$PACKET/snapshot/release-gate-evidence.json"
          BODY="$PACKET/provenance/stable-release-body.md"
          mkdir -p "$Q"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$Q"
          (cd "$Q" && shasum -a 256 -c RoachNet-Setup-macOS.dmg.sha256)
          [[ "$(shasum -a 256 "$Q/RoachNet-Setup-macOS.dmg" | awk '{print $1}')" == "$EXPECTED_DMG_SHA256" ]]
          while IFS= read -r asset_name; do cmp "$PACKET/quarantine/$asset_name" "$Q/$asset_name"; done < <(node -e 'const s=require(process.argv[1]); for(const a of s.assets) console.log(a.name)' "$SNAPSHOT")
          RELEASE_ID="$(node -p 'require(process.argv[1]).releaseId' "$SNAPSHOT")"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/fresh-staged-release.json"
          node scripts/staged-release-snapshot.mjs --mode verify --release-json "$RUNNER_TEMP/fresh-staged-release.json" --provenance "$PROVENANCE" --notes "$RELEASE_NOTES_PATH" --snapshot "$SNAPSHOT"
          node scripts/verify-release-body.mjs --notes "$RELEASE_NOTES_PATH" --provenance "$PROVENANCE" --body "$BODY"
          node scripts/verify-release-gate-evidence.mjs --evidence "$GATES" --provenance "$PROVENANCE" --snapshot "$SNAPSHOT"
          node scripts/verify-release-gate-materials.mjs \
            --results "$PACKET/gate-materials/release-gate-results.json" \
            --evidence-root "$PACKET/gate-materials/gate-evidence" \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-sha "$CANDIDATE_SHA" \
            --artifact-sha256 "$EXPECTED_DMG_SHA256"
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" 2>/dev/null | awk 'NR == 1 {print $1}' || true)"
          if [[ -z "$REMOTE_TAG_SHA" ]]; then REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" 2>/dev/null | awk 'NR == 1 {print $1}' || true)"; fi
          [[ "$REMOTE_TAG_SHA" == "$CANDIDATE_SHA" ]]
          xcrun notarytool store-credentials roachnet-promotion-notary --apple-id "$APPLE_NOTARY_APPLE_ID" --team-id "$APPLE_NOTARY_TEAM_ID" --password "$APPLE_NOTARY_APP_PASSWORD"
          NOTARY_SUBMISSION_ID="$(node -p 'require(process.argv[1]).notarization.submissionId' "$PROVENANCE")"
          xcrun notarytool info "$NOTARY_SUBMISSION_ID" --keychain-profile roachnet-promotion-notary --output-format json > "$RUNNER_TEMP/promotion-notary-info.json"
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync(process.argv[1])); if(p.id!==process.argv[2]||p.status!=="Accepted") process.exit(1)' "$RUNNER_TEMP/promotion-notary-info.json" "$NOTARY_SUBMISSION_ID"
      - name: Prepare canonical predicate and exact attestation subjects
        shell: bash
        run: |
          set -euo pipefail
          PACKET="$RUNNER_TEMP/verification-packet"
          node scripts/prepare-go-live-attestation.mjs \
            --decision "$GO_LIVE_DECISION" \
            --repository "$GITHUB_REPOSITORY" \
            --evidence "$PACKET/snapshot/release-gate-evidence.json" \
            --provenance "$PACKET/quarantine/release-provenance.json" \
            --snapshot "$PACKET/snapshot/staged-release-snapshot.json" \
            --body "$PACKET/provenance/stable-release-body.md" \
            --asset-root "$RUNNER_TEMP/fresh-quarantine" \
            --promotion-run-id "$GITHUB_RUN_ID" \
            --promotion-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --triggering-actor "$GITHUB_TRIGGERING_ACTOR" \
            --issued-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --predicate-out "$RUNNER_TEMP/go-live-predicate.json" \
            --subjects-dir "$RUNNER_TEMP/go-live-subjects" \
            --subjects-manifest-out "$RUNNER_TEMP/go-live-subjects.json" \
            --checksums-out "$RUNNER_TEMP/go-live-subjects.sha256"
      - name: Persist OIDC-signed custom GO-LIVE attestation
        id: go-live-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/go-live-subjects/*
          predicate-type: https://github.com/RoachWares/RoachNet/attestations/go-live/v1
          predicate-path: ${{ runner.temp }}/go-live-predicate.json
      - name: Verify persisted Sigstore bundle, workflow identity, subjects, predicate, and current run
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.go-live-attestation.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.go-live-attestation.outputs.attestation-url }}
          ATTESTATION_BUNDLE: ${{ steps.go-live-attestation.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$ATTESTATION_ID" && -n "$ATTESTATION_URL" && -s "$ATTESTATION_BUNDLE" ]]
          [[ "$ATTESTATION_URL" == "https://github.com/$GITHUB_REPOSITORY/attestations/$ATTESTATION_ID" ]]
          node scripts/verify-go-live-attestation.mjs --bundle "$ATTESTATION_BUNDLE" --predicate "$RUNNER_TEMP/go-live-predicate.json" --subjects "$RUNNER_TEMP/go-live-subjects.json"
          SIGNER_WORKFLOW="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          while IFS= read -r subject_path; do
            gh attestation verify "$subject_path" --repo "$GITHUB_REPOSITORY" --predicate-type "$GO_LIVE_PREDICATE_TYPE" --signer-workflow "$SIGNER_WORKFLOW" --source-digest "$CANDIDATE_SHA" >/dev/null
            gh attestation verify "$subject_path" --bundle "$ATTESTATION_BUNDLE" --repo "$GITHUB_REPOSITORY" --predicate-type "$GO_LIVE_PREDICATE_TYPE" --signer-workflow "$SIGNER_WORKFLOW" --source-digest "$CANDIDATE_SHA" >/dev/null
          done < <(node -e 'const s=require(process.argv[1]); for(const x of s) console.log(x.path)' "$RUNNER_TEMP/go-live-subjects.json")
          BUNDLE_SHA256="$(shasum -a 256 "$ATTESTATION_BUNDLE" | awk '{print $1}')"
          ATTESTATION_ID="$ATTESTATION_ID" ATTESTATION_URL="$ATTESTATION_URL" BUNDLE_SHA256="$BUNDLE_SHA256" node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1],JSON.stringify({schema:"org.roachnet.go-live-attestation-record.v1",attestationId:process.env.ATTESTATION_ID,attestationUrl:process.env.ATTESTATION_URL,bundleSha256:process.env.BUNDLE_SHA256},null,2)+"\n")' "$RUNNER_TEMP/go-live-attestation-record.json"
          cp "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/go-live-attestation-bundle.json"
      - name: Upload portable GO-LIVE predicate, checksums, and Sigstore bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roachnet-go-live-attestation-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-live-predicate.json
            ${{ runner.temp }}/go-live-subjects.json
            ${{ runner.temp }}/go-live-subjects.sha256
            ${{ runner.temp }}/go-live-attestation-record.json
            ${{ runner.temp }}/go-live-attestation-bundle.json
          if-no-files-found: error
          retention-days: 90
      - name: Mint repository-scoped production release App token only after attestation verification
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ROACHNET_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROACHNET_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: RoachNet
          permission-contents: write
          permission-workflows: write
      - name: Promote once, then perform authenticated and unauthenticated exact-byte readback
        id: promotion
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          ATTESTATION_ID: ${{ steps.go-live-attestation.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.go-live-attestation.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          PACKET="$RUNNER_TEMP/verification-packet"
          Q="$RUNNER_TEMP/fresh-quarantine"
          PROVENANCE="$PACKET/quarantine/release-provenance.json"
          SNAPSHOT="$PACKET/snapshot/staged-release-snapshot.json"
          BODY="$PACKET/provenance/stable-release-body.md"
          RELEASE_ID="$(node -p 'require(process.argv[1]).releaseId' "$SNAPSHOT")"
          VERSION="$(node -p 'require("./package.json").version')"
          RESULT="$RUNNER_TEMP/promotion-result.json"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1],JSON.stringify({schema:"org.roachnet.promotion-result.v1",decision:"NO-GO",reason:"Promotion did not complete."},null,2)+"\n")' "$RESULT"
          no_go() {
            local reason="$1"
            REASON="$reason" ATTESTATION_ID="$ATTESTATION_ID" ATTESTATION_URL="$ATTESTATION_URL" node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1],JSON.stringify({schema:"org.roachnet.promotion-result.v1",decision:"NO-GO",reason:process.env.REASON,attestationId:process.env.ATTESTATION_ID,attestationUrl:process.env.ATTESTATION_URL},null,2)+"\n")' "$RESULT"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=true -F prerelease=true >/dev/null 2>&1 || true
            echo "NO-GO: $reason" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/immediate-pre-patch-release.json"
          node scripts/staged-release-snapshot.mjs --mode verify --release-json "$RUNNER_TEMP/immediate-pre-patch-release.json" --provenance "$PROVENANCE" --notes "$RELEASE_NOTES_PATH" --snapshot "$SNAPSHOT"
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" 2>/dev/null | awk 'NR == 1 {print $1}' || true)"
          if [[ -z "$REMOTE_TAG_SHA" ]]; then REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" 2>/dev/null | awk 'NR == 1 {print $1}' || true)"; fi
          [[ "$REMOTE_TAG_SHA" == "$CANDIDATE_SHA" ]] || no_go 'Tag changed before release update.'
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f name="RoachNet $VERSION" -F "body=@$BODY" > "$RUNNER_TEMP/patch-response.json"; then
            no_go 'GitHub Update Release returned an ambiguous failure; promotion was not retried.'
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/authenticated-release.json" || no_go 'Authenticated release readback failed.'
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/unauthenticated-release.json" || no_go 'Unauthenticated release readback failed.'
          node scripts/verify-published-release.mjs --release-json "$RUNNER_TEMP/patch-response.json" --snapshot "$SNAPSHOT" --provenance "$PROVENANCE" --body "$BODY" --version "$VERSION" || no_go 'Update response did not match staged identity.'
          node scripts/verify-published-release.mjs --release-json "$RUNNER_TEMP/authenticated-release.json" --snapshot "$SNAPSHOT" --provenance "$PROVENANCE" --body "$BODY" --version "$VERSION" || no_go 'Authenticated readback did not match staged identity.'
          node scripts/verify-published-release.mjs --release-json "$RUNNER_TEMP/unauthenticated-release.json" --snapshot "$SNAPSHOT" --provenance "$PROVENANCE" --body "$BODY" --version "$VERSION" || no_go 'Unauthenticated readback did not match staged identity.'
          PUBLIC_DMG_URL="$(node -p 'require(process.argv[1]).artifact.url' "$PROVENANCE")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$PUBLIC_DMG_URL" --output "$RUNNER_TEMP/public-RoachNet-Setup-macOS.dmg" || no_go 'Public DMG download failed.'
          [[ "$(shasum -a 256 "$RUNNER_TEMP/public-RoachNet-Setup-macOS.dmg" | awk '{print $1}')" == "$EXPECTED_DMG_SHA256" ]] || no_go 'Public DMG digest does not match the staged artifact.'
          cmp "$Q/RoachNet-Setup-macOS.dmg" "$RUNNER_TEMP/public-RoachNet-Setup-macOS.dmg" || no_go 'Public DMG bytes do not match quarantine.'
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" 2>/dev/null | awk 'NR == 1 {print $1}' || true)"
          if [[ -z "$REMOTE_TAG_SHA" ]]; then REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" 2>/dev/null | awk 'NR == 1 {print $1}' || true)"; fi
          [[ "$REMOTE_TAG_SHA" == "$CANDIDATE_SHA" ]] || no_go 'Tag changed during promotion.'
          ATTESTATION_ID="$ATTESTATION_ID" ATTESTATION_URL="$ATTESTATION_URL" RELEASE_ID="$RELEASE_ID" CANDIDATE_SHA="$CANDIDATE_SHA" DMG_SHA256="$EXPECTED_DMG_SHA256" node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1],JSON.stringify({schema:"org.roachnet.promotion-result.v1",decision:"GO",releaseId:Number(process.env.RELEASE_ID),candidateSha:process.env.CANDIDATE_SHA,dmgSha256:process.env.DMG_SHA256,attestationId:process.env.ATTESTATION_ID,attestationUrl:process.env.ATTESTATION_URL},null,2)+"\n")' "$RESULT"
      - name: Upload final GO or NO-GO promotion result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roachnet-promotion-result-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-result.json
          if-no-files-found: warn
          retention-days: 90
