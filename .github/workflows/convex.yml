name: Convex

on:
  pull_request:
    paths:
      - "convex/**"
      - "convex.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex.yml"
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "convex.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convex:
    name: Validate Convex functions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The deploy key reaches only the deploy step, never npm ci or the
    # typecheck, so a pull request's dependency scripts can't read it.
    env:
      HAS_CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Convex functions
        run: npm run convex:typecheck

      - name: Deploy Convex production
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CONVEX_DEPLOY_KEY == 'true' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npm run convex:deploy

      - name: Skip Convex deployment
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || env.HAS_CONVEX_DEPLOY_KEY != 'true' }}
        run: echo "Convex deploy skipped. Add CONVEX_DEPLOY_KEY to RoachWares secrets when the production deployment is ready."
