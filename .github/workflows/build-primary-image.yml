name: Build Primary Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to label the Docker image under (no "v" prefix, e.g. "1.2.3")'
        required: true
        type: string
      tag_latest:
        description: 'Also tag this image as :latest? (Keep false for RC and beta releases)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check_authorization:
    name: Check authorization to publish new Docker image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      isAuthorized: ${{ steps.check-auth.outputs.is_authorized }}
    steps:
      - name: check-auth
        id: check-auth
        env:
          AUTHORIZED_USERS: ${{ secrets.DEPLOYMENT_AUTHORIZED_USERS }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        # Exact-match the comma-separated allowlist; a substring test would let
        # "bob" publish whenever "bobby" is listed.
        run: |
          set -euo pipefail
          is_authorized=false
          IFS=',' read -r -a allowed <<<"${AUTHORIZED_USERS}"
          for user in "${allowed[@]}"; do
            if [[ "$(printf '%s' "$user" | tr -d '[:space:]')" == "${TRIGGERING_ACTOR}" ]]; then is_authorized=true; fi
          done
          echo "is_authorized=${is_authorized}" >> "$GITHUB_OUTPUT"
  build:
    name: Build Docker image
    needs: check_authorization
    if: needs.check_authorization.outputs.isAuthorized == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@e4c1c000c95f9cc255f72940e9c56bcbd1239436 # v1
      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          push: true
          tags: |
            ghcr.io/roachwares/roachnet:${{ inputs.version }}
            ghcr.io/roachwares/roachnet:v${{ inputs.version }}
            ${{ inputs.tag_latest && 'ghcr.io/roachwares/roachnet:latest' || '' }}
          build-args: |
            VERSION=${{ inputs.version }}
            BUILD_DATE=${{ github.event.workflow_run.created_at }}
            VCS_REF=${{ github.sha }}
