name: Bug Report
description: Report a bug or issue with RoachNet.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a RoachNet bug. Give us the concrete failure, the logs you can safely share, and the lane that broke.
        
        **Before submitting:**
        - Search existing issues to avoid duplicates
        - Ensure you're running the latest RoachNet release
        - Redact any personal or sensitive information from logs/configs
        - Keep the report focused on the native app, setup app, Homebrew lane, or public release artifacts

  - type: dropdown
    id: issue-category
    attributes:
      label: Issue Category
      description: What area is this issue related to?
      options:
        - Installation/Setup
        - RoachClaw / Local models
        - Org / Agents / Traces
        - RoachNet Cluster
        - Vault / Archive
        - Maps
        - Packs / Themes
        - RoachArcade / Games
        - RoachPlayer / Media
        - Dev Workspace
        - iOS companion / RoachTail
        - Runtime / Local API
        - System Performance/Resources
        - UI/UX Issue
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of what the bug is
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected outcome
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually occurred, including any error messages
    validations:
      required: true

  - type: input
    id: roachnet-version
    attributes:
      label: RoachNet Version
      description: What version of RoachNet are you running? Check Settings, the setup app, or the GitHub release you installed.
      placeholder: "e.g., 1.0.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running RoachNet on?
      options:
        - macOS 27 on Apple Silicon
        - macOS 26 on Apple Silicon
        - macOS 15 on Apple Silicon
        - macOS 14 on Apple Silicon
        - macOS on Intel (not supported)
        - iOS / SideStore companion
        - Other
    validations:
      required: true

  - type: input
    id: docker-version
    attributes:
      label: Install Lane
      description: Which install lane did you use?
      placeholder: "e.g., setup app, Homebrew cask, GitHub DMG, local build"

  - type: dropdown
    id: gpu-present
    attributes:
      label: Apple Silicon Mac?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: gpu-model
    attributes:
      label: Mac Model
      description: What Mac are you using?
      placeholder: "e.g., MacBook Pro M3 Pro, 18 GB RAM"

  - type: textarea
    id: system-specs
    attributes:
      label: System Specifications
      description: Provide relevant system specs (CPU, RAM, available disk space)
      placeholder: |
        CPU: 
        RAM: 
        Available Disk Space: 
        GPU (if any): 

  - type: textarea
    id: service-status
    attributes:
      label: Service Status (if relevant)
      description: If this is a service-related issue, what is the status of relevant services? Check Settings, the setup app, or RoachNet logs.
      placeholder: |
        Paste safe service status output or describe service states from the UI

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Include any relevant logs or error messages. **Please redact any personal/sensitive information.**
        
        Useful places to check:
        - RoachNet setup logs
        - RoachNet runtime logs
        - RoachClaw/Ollama logs if local AI is involved
      placeholder: Paste relevant log output here
      render: shell

  - type: textarea
    id: browser-console
    attributes:
      label: Browser Console Errors (if UI issue)
      description: If this is a UI issue, include any errors from your browser's developer console (F12)
      placeholder: Paste browser console errors here
      render: javascript

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem (drag and drop images here)

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (network setup, custom configurations, recent changes, etc.)

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following before submitting
      options:
        - label: I have searched for existing issues that might be related to this bug
          required: true
        - label: I am running the latest RoachNet release, or I noted the exact version above
          required: true
        - label: I have redacted any personal or sensitive information from logs and screenshots
          required: true
        - label: I included the install lane and hardware details needed to reproduce this
          required: false
